<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balão Subindo</title>
  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="balão" id="balão"></div>

  <button onclick="controlarBalao()">
    Pausar / Continuar
  </button>

  <script>
    const balao = document.getElementById("balão");

    function controlarBalao() {
      balao.classList.toggle("pausado");
    }
  </script>

</body>
</html>
